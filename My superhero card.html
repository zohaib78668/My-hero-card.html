<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SuperHero card</title>
<style>


  body {
    background-color: navy;
    color:white;
    font-family:Verdana, Geneva, Tahoma, sans-serif;
  }


 .hero-name {
  font-size: 50px;
  font-weight: bold;
  color: yellow;
  text-shadow: 4px 4px 2px red;
 }

.tagline {
   font-style: italic;
   color: lightblue;
   text-transform: capitalize;
  }


.label {
  text-transform: uppercase;
  text-decoration: underline;
  color: darkred;
}


.power {
  font-weight: bold;
  color: lightgreen;
}


.weakness {
   text-decoration: line-through;
   color: gray;
}


.badge {
font-size: 28px;
font-weight: bold;
color: gold;
transform: rotate(15deg);
}


.made-by   {
  color: coral;
  font-style: italic;
}

</style>
</head>
<body>
 <h1 class="hero-name">Apex stike</h1>

<p class="tagline">the most powerful hero in the school</p>

<h2 class="label">super powers</h2>

<p class="power">Can run faster than a cheetah</p>

<p class="power">Super strength</p>

<p class="power">can fly</p>

<h2 class="label">weaknesses</h2>

<p class="weakness">Subjects</p>

<p class="weakness">vegetables</p>

<p class="badge">Top Hero</p>

<p class="made-by">Created by Zohaib Ali</p>   
</body>
</html>
